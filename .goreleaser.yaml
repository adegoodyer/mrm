# GoReleaser config for mrm: `task release:check`, `task release:snapshot`,
# and `task release` on a pushed vX.Y.Z tag (needs GITHUB_TOKEN) - the weekly
# Release workflow (.github/workflows/release.yml) runs that one.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mrm
    main: .
    binary: mrm
    env:
      - CGO_ENABLED=0
    # Linux and macOS only (WSL counts as Linux): the sync lock uses flock.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md via --release-notes (task release),
# which replaces the generated commit list. Don't set changelog.disable: it
# drops the --release-notes file too (0.1.0 went out with an empty body).
changelog:
  sort: asc

# Published straight away: the Release workflow has already run task check.
release:
  draft: false
  prerelease: auto
