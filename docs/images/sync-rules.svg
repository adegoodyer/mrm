<svg xmlns="http://www.w3.org/2000/svg" width="880" height="804" viewBox="0 0 880 804" role="img" aria-label="What mrm sync does to each repo, in order"><title>What mrm sync does to each repo, in order</title><style>
  .bg{fill:#ffffff;stroke:#d0d7de} .card{fill:#f6f8fa;stroke:#d0d7de} .hi{fill:#ddf4ff;stroke:#54aeff}
  .t{fill:#1f2328} .m{fill:#59636e} .ln{stroke:#8c959f;fill:none} .ah{fill:#8c959f}
  .ok{fill:#1a7f37} .warn{fill:#9a6700} .bad{fill:#cf222e} .acc{fill:#0969da} .neu{fill:#59636e}
  .okb{fill:#dafbe1} .warnb{fill:#fff8c5} .badb{fill:#ffebe9} .neub{fill:#eaeef2} .accb{fill:#ddf4ff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117;stroke:#30363d} .card{fill:#161b22;stroke:#30363d} .hi{fill:#0c2d4b;stroke:#1f6feb}
    .t{fill:#e6edf3} .m{fill:#9198a1} .ln{stroke:#6e7681} .ah{fill:#6e7681}
    .ok{fill:#3fb950} .warn{fill:#d29922} .bad{fill:#ff7b72} .acc{fill:#58a6ff} .neu{fill:#9198a1}
    .okb{fill:#12261e} .warnb{fill:#2b2111} .badb{fill:#2d1517} .neub{fill:#21262d} .accb{fill:#0c2d4b}
  }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:13px}
  .h{font-weight:600} .s{font-size:12.5px} .xl{font-size:16px;font-weight:600}
</style><rect class="bg" x="0.5" y="0.5" width="879" height="803" rx="10"/>
<text class="t xl" x="24" y="44" text-anchor="start">What sync does to each repo</text>
<text class="m" x="24" y="66" text-anchor="start">8 repos at a time. The first question that matches decides what happens.</text>
<rect class="accb" x="24" y="80" width="832" height="30" rx="6"/>
<text x="40" y="100" text-anchor="start"><tspan class="t mono h">git fetch --prune origin</tspan><tspan class="m s">   then origin/HEAD is re-checked at most once a day</tspan></text>
<rect class="card" x="24" y="126" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="150" text-anchor="start">1.  Fetch fails or times out</text>
<text class="m s" x="60" y="170" text-anchor="start">the reason in plain words: offline?, no access, key rejected</text>
<path class="ln" d="M494 153.0 L548 153.0" stroke-width="1.5"/>
<polygon class="ah" points="548,153.0 540,148.0 540,158.0"/>
<rect class="badb" x="550" y="138.0" width="306" height="30" rx="15"/>
<text x="564" y="158.0" text-anchor="start"><tspan class="bad h">✗  </tspan><tspan class="t">failed</tspan></text>
<path class="ln" d="M60 180 L60 196" stroke-width="1.5"/>
<polygon class="ah" points="60,196 55,188 65,188"/>
<text class="m s" x="70" y="192" text-anchor="start">no</text>
<rect class="card" x="24" y="196" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="220" text-anchor="start">2.  Merge, rebase, cherry-pick or revert in progress</text>
<text class="m s" x="60" y="240" text-anchor="start">finish it in git; mrm doesn&#x27;t touch it</text>
<path class="ln" d="M494 223.0 L548 223.0" stroke-width="1.5"/>
<polygon class="ah" points="548,223.0 540,218.0 540,228.0"/>
<rect class="warnb" x="550" y="208.0" width="306" height="30" rx="15"/>
<text x="564" y="228.0" text-anchor="start"><tspan class="warn h">!  </tspan><tspan class="t">skipped</tspan></text>
<path class="ln" d="M60 250 L60 266" stroke-width="1.5"/>
<polygon class="ah" points="60,266 55,258 65,258"/>
<text class="m s" x="70" y="262" text-anchor="start">no</text>
<rect class="card" x="24" y="266" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="290" text-anchor="start">3.  Detached HEAD</text>
<text class="m s" x="60" y="310" text-anchor="start">fetched only</text>
<path class="ln" d="M494 293.0 L548 293.0" stroke-width="1.5"/>
<polygon class="ah" points="548,293.0 540,288.0 540,298.0"/>
<rect class="warnb" x="550" y="278.0" width="306" height="30" rx="15"/>
<text x="564" y="298.0" text-anchor="start"><tspan class="warn h">!  </tspan><tspan class="t">skipped</tspan></text>
<path class="ln" d="M60 320 L60 336" stroke-width="1.5"/>
<polygon class="ah" points="60,336 55,328 65,328"/>
<text class="m s" x="70" y="332" text-anchor="start">no</text>
<rect class="card" x="24" y="336" width="470" height="72" rx="8"/>
<text class="t h" x="40" y="360" text-anchor="start">4.  On another branch</text>
<text class="m s" x="60" y="380" text-anchor="start">the default branch is fast-forwarded in place if behind;</text>
<text class="m s" x="60" y="398" text-anchor="start">your branch is left alone (ff_current: true moves it too)</text>
<path class="ln" d="M494 372.0 L548 372.0" stroke-width="1.5"/>
<polygon class="ah" points="548,372.0 540,367.0 540,377.0"/>
<rect class="okb" x="550" y="357.0" width="306" height="30" rx="15"/>
<text x="564" y="377.0" text-anchor="start"><tspan class="ok h">✓  </tspan><tspan class="t">default branch updated</tspan></text>
<path class="ln" d="M60 408 L60 424" stroke-width="1.5"/>
<polygon class="ah" points="60,424 55,416 65,416"/>
<text class="m s" x="70" y="420" text-anchor="start">no</text>
<rect class="card" x="24" y="424" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="448" text-anchor="start">5.  On the default branch, not behind</text>
<text class="m s" x="60" y="468" text-anchor="start">ahead is unpushed work, not a sync problem</text>
<path class="ln" d="M494 451.0 L548 451.0" stroke-width="1.5"/>
<polygon class="ah" points="548,451.0 540,446.0 540,456.0"/>
<rect class="neub" x="550" y="436.0" width="306" height="30" rx="15"/>
<text x="564" y="456.0" text-anchor="start"><tspan class="neu h">·  </tspan><tspan class="t">current</tspan></text>
<path class="ln" d="M60 478 L60 494" stroke-width="1.5"/>
<polygon class="ah" points="60,494 55,486 65,486"/>
<text class="m s" x="70" y="490" text-anchor="start">no</text>
<rect class="card" x="24" y="494" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="518" text-anchor="start">6.  Ahead and behind</text>
<text class="m s" x="60" y="538" text-anchor="start">rebase or merge it yourself</text>
<path class="ln" d="M494 521.0 L548 521.0" stroke-width="1.5"/>
<polygon class="ah" points="548,521.0 540,516.0 540,526.0"/>
<rect class="warnb" x="550" y="506.0" width="306" height="30" rx="15"/>
<text x="564" y="526.0" text-anchor="start"><tspan class="warn h">!  </tspan><tspan class="t">skipped: diverged</tspan></text>
<path class="ln" d="M60 548 L60 564" stroke-width="1.5"/>
<polygon class="ah" points="60,564 55,556 65,556"/>
<text class="m s" x="70" y="560" text-anchor="start">no</text>
<rect class="card" x="24" y="564" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="588" text-anchor="start">7.  Tracked files changed</text>
<text class="m s" x="60" y="608" text-anchor="start">untracked files don&#x27;t count</text>
<path class="ln" d="M494 591.0 L548 591.0" stroke-width="1.5"/>
<polygon class="ah" points="548,591.0 540,586.0 540,596.0"/>
<rect class="warnb" x="550" y="576.0" width="306" height="30" rx="15"/>
<text x="564" y="596.0" text-anchor="start"><tspan class="warn h">!  </tspan><tspan class="t">skipped: dirty</tspan></text>
<path class="ln" d="M60 618 L60 634" stroke-width="1.5"/>
<polygon class="ah" points="60,634 55,626 65,626"/>
<text class="m s" x="70" y="630" text-anchor="start">no</text>
<rect class="card" x="24" y="634" width="470" height="54" rx="8"/>
<text class="t h" x="40" y="658" text-anchor="start">8.  Clean and strictly behind</text>
<text class="m s" x="60" y="678" text-anchor="start">git merge --ff-only</text>
<path class="ln" d="M494 661.0 L548 661.0" stroke-width="1.5"/>
<polygon class="ah" points="548,661.0 540,656.0 540,666.0"/>
<rect class="okb" x="550" y="646.0" width="306" height="30" rx="15"/>
<text x="564" y="666.0" text-anchor="start"><tspan class="ok h">✓  </tspan><tspan class="t">synced</tspan></text>
<rect class="card" x="24" y="708" width="832" height="34" rx="6"/>
<text x="40" y="730" text-anchor="start"><tspan class="t h">If HEAD moved: </tspan><tspan class="m">post_sync hooks run (a failing hook is a warning, the sync still counts).</tspan></text>
<text x="24" y="776" text-anchor="start"><tspan class="bad h">Never: </tspan><tspan class="t">stash · reset · rebase · merge commits · force · branch deletes.</tspan><tspan class="m s">  Exit 0 all good, 2 something needs attention, 1 mrm failed.</tspan></text>
</svg>
