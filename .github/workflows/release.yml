name: Release

# Mondays 08:00 UTC, after the morning's Renovate run (06:30 UK) has merged the week's updates:
# release whatever master has gathered since the last tag - CHANGELOG [Unreleased] notes, Go module
# bumps, a newer Go in mise.toml. Nothing new, no release. .github/scripts/release.py picks the
# version from the notes, writes the dated CHANGELOG section, commits and tags; this pushes them
# and publishes the GitHub release with the four archives.
# Run it from the Actions tab for an early release, with a version (e.g. 1.0.0) to choose it, or as
# a dry run to see what would ship (task release:next shows the same locally).
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z) - empty to work it out from CHANGELOG.md
        required: false
        default: ""
      dry-run:
        description: Only show what would be released
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the release commit, the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0 # tags and history: the last version and the go.mod diff since it

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      # never tag a master that does not pass
      - name: task check
        run: task check

      - name: Work out the release, commit and tag
        id: next
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
        run: python3 .github/scripts/release.py

      # both or neither: a tag without its CHANGELOG commit, or the reverse, never lands
      - name: Push the release commit and tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: git push --atomic origin HEAD:master "v$VERSION"

      - name: Publish the GitHub release
        if: steps.next.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release

      # so go install ...@latest sees the new version straight away
      - name: Tell the Go module proxy
        if: steps.next.outputs.version != ''
        continue-on-error: true
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: curl -fsS "https://proxy.golang.org/github.com/adegoodyer/mrm/@v/v$VERSION.info"
