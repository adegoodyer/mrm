version: "3"

vars:
  BINARY: bin/mrm
  PKG: .

# Single Taskfile is enough at this size; namespaced groups (test:*) keep
# related commands discoverable without includes.

tasks:
  default:
    desc: Show available tasks (list)
    cmds:
      - task --list

  deps:
    desc: Download and tidy Go module dependencies (modules)
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go source (gofmt)
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet (static checks)
    cmds:
      - go vet ./...

  test:
    desc: Run the tests - real git fixtures in temp dirs (offline)
    cmds:
      - go test ./...

  test:unit:
    desc: Run the tests with race detector and coverage (race+cover)
    cmds:
      - go test -race -count=1 -cover ./...

  check:
    desc: fmt check + vet + test:unit (pre-merge)
    cmds:
      - 'test -z "$(gofmt -l .)" || (gofmt -l . && echo "unformatted - run task fmt" && exit 1)'
      - task: vet
      - task: test:unit

  build:
    desc: Build the mrm binary into bin/ (compile)
    cmds:
      - mkdir -p bin
      - go build -o {{.BINARY}} {{.PKG}}

  install:
    desc: Install mrm into GOBIN (go install)
    cmds:
      - go install {{.PKG}}

  test:smoke:
    desc: Build and run doctor, status and a dry-run sync in ROOT (default the current dir) - fetches, changes no branches
    deps: [build]
    dir: '{{.ROOT | default .USER_WORKING_DIR}}'
    cmds:
      - '{{.TASKFILE_DIR}}/{{.BINARY}} doctor'
      - '{{.TASKFILE_DIR}}/{{.BINARY}} status'
      - '{{.TASKFILE_DIR}}/{{.BINARY}} sync --dry-run || test $? -eq 2'

  run:
    desc: Run mrm from source (pass args after --)
    cmds:
      - go run . {{.CLI_ARGS}}

  release:check:
    desc: Validate the GoReleaser config (config)
    cmds:
      - mise exec goreleaser@2.18.2 -- goreleaser check

  release:snapshot:
    desc: Build every release archive into dist/ without publishing (snapshot)
    cmds:
      - mise exec goreleaser@2.18.2 -- goreleaser release --snapshot --clean

  release:
    desc: Publish a draft GitHub release for the current vX.Y.Z tag (needs GITHUB_TOKEN)
    cmds:
      # Notes are this version's CHANGELOG section; bin/, as --clean empties dist/.
      - mkdir -p bin
      - awk '/^## \[/{p=index($0,"[{{.VERSION}}]")>0; next} p' CHANGELOG.md > bin/release-notes.md
      - test -s bin/release-notes.md || (echo "no CHANGELOG section for {{.VERSION}}" && exit 1)
      - mise exec goreleaser@2.18.2 -- goreleaser release --clean --release-notes bin/release-notes.md
    vars:
      VERSION:
        sh: git describe --tags --exact-match | sed 's/^v//'

  clean:
    desc: Remove build artifacts (bin/dist)
    cmds:
      - rm -rf bin dist
